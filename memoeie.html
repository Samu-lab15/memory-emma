<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>1 an & 10 mois ❤</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💌</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Caveat:wght@500;700&display=swap" rel="stylesheet">

<script>
/* =========================================================
   ✏️  CONFIGURATION — MODIFIE UNIQUEMENT CETTE PARTIE
   ========================================================= */
const CONFIG = {
  // Titre affiché en haut
  titre: "Nos meilleurs souvenirs",

  // Petit texte d'intro (tu peux sauter des lignes avec \n)
  intro: "J'avais trouvé un site hyper stylé ou tu pouvais créer ton propre mémorie" +
         "Mais c'était payant, alors j'ai décider de faire.(Youpii)" +
         "J'ai fait une petite séléction de mes photos préférés \n\n(Je t'aime +)",

  // Signature sous le texte d'intro
  signature: "— Ton copain",

  // Message affiché quand toutes les paires sont trouvées
  messageFin: "Tu as retrouvé les paires (trop forte)(sauf si t'as fait plus que 20).\nEt j'ai hâte d'en créer des centaines d'autres avec toi.\n\nJ'ai cro hate de te revoir",

  // Les 12 photos (dans le dossier "images")
  images: [
    "images/photo1.jpg",  "images/photo2.jpg",  "images/photo3.jpg",
    "images/photo4.jpg",  "images/photo5.jpg",  "images/photo6.jpg",
    "images/photo7.jpg",  "images/photo8.jpg",  "images/photo9.jpg",
    "images/photo10.jpg", "images/photo11.jpg", "images/photo12.jpg"
  ]
};
/* ========================================================= */
</script>

<style>
:root {
  --rose: #F2D4CE;
  --rose-deep: #E7B9B0;
  --bordeaux: #6B1E2E;
  --bordeaux-dark: #4A1320;
  --ivoire: #FFFBF7;
  --or: #C9A46A;
  --encre: #3A1620;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; margin: 0; }

body {
  min-height: 100vh;
  background: var(--rose);
  background-image: radial-gradient(circle at 20% 10%, #F8E3DE 0, transparent 45%),
                    radial-gradient(circle at 85% 90%, var(--rose-deep) 0, transparent 50%);
  color: var(--encre);
  font-family: "Young Serif", Georgia, "Times New Roman", serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 14px 40px;
}

h1 {
  font-size: clamp(2.2rem, 7vw, 3.6rem);
  color: var(--bordeaux);
  font-weight: 400;
  letter-spacing: -0.01em;
  text-align: center;
  line-height: 1.05;
}

.hidden { display: none !important; }

/* ---------- Intro : la lettre ---------- */
#intro {
  margin-top: 28px;
  max-width: 460px;
  width: 100%;
  background: var(--ivoire);
  padding: 34px 30px 30px;
  border-radius: 4px;
  box-shadow: 0 18px 40px -18px rgba(74, 19, 32, .45);
  transform: rotate(-1.2deg);
  position: relative;
}
#intro::before { /* le petit ruban adhésif */
  content: "";
  position: absolute;
  top: -12px; left: 50%;
  width: 110px; height: 26px;
  transform: translateX(-50%) rotate(2deg);
  background: rgba(201, 164, 106, .55);
}
#intro-text {
  font-family: "Caveat", "Segoe Script", cursive;
  font-size: 1.55rem;
  line-height: 1.35;
  white-space: pre-line;
}
#intro-sign {
  font-family: "Caveat", cursive;
  font-size: 1.5rem;
  font-weight: 700;
  text-align: right;
  margin-top: 14px;
  color: var(--bordeaux);
}

button {
  font-family: inherit;
  font-size: 1.05rem;
  background: var(--bordeaux);
  color: var(--ivoire);
  border: none;
  border-radius: 999px;
  padding: 13px 28px;
  cursor: pointer;
  margin-top: 26px;
  transition: background .2s;
}
button:hover { background: var(--bordeaux-dark); }
button:focus-visible { outline: 3px solid var(--or); outline-offset: 3px; }
.center { display: flex; justify-content: center; }

/* ---------- Jeu ---------- */
#stats {
  margin: 14px 0 20px;
  font-size: 1rem;
  color: var(--bordeaux);
}

#board {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 12px;
  width: 100%;
  max-width: 820px;
}
@media (max-width: 640px) {
  #board { grid-template-columns: repeat(4, 1fr); gap: 8px; }
}

.card {
  aspect-ratio: 3 / 4;
  perspective: 900px;
  cursor: pointer;
  border: none;
  background: none;
  padding: 0;
  margin: 0;
}
.card:focus-visible { outline: 3px solid var(--bordeaux); outline-offset: 3px; border-radius: 6px; }

.inner {
  position: relative;
  width: 100%; height: 100%;
  transition: transform .5s cubic-bezier(.4, .2, .2, 1);
  transform-style: preserve-3d;
}
.card.flipped .inner, .card.matched .inner { transform: rotateY(180deg); }

.face {
  position: absolute; inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: 6px;
  overflow: hidden;
}
.back {
  background: var(--bordeaux);
  display: grid;
  place-items: center;
  color: var(--or);
  box-shadow: inset 0 0 0 4px var(--bordeaux), inset 0 0 0 5px var(--or);
}
.back svg { width: 38%; height: auto; }

.front { /* façon polaroid */
  transform: rotateY(180deg);
  background: var(--ivoire);
  padding: 6% 6% 18%;
  box-shadow: 0 6px 14px -6px rgba(74, 19, 32, .5);
}
.front img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  background: var(--rose-deep);
}
.card.matched .front { box-shadow: 0 0 0 3px var(--or), 0 6px 14px -6px rgba(74, 19, 32, .5); }

/* ---------- Fin ---------- */
#end {
  position: fixed; inset: 0;
  background: rgba(74, 19, 32, .82);
  display: grid;
  place-items: center;
  padding: 20px;
  z-index: 10;
}
#end .letter {
  background: var(--ivoire);
  max-width: 440px;
  padding: 34px 30px;
  border-radius: 4px;
  text-align: center;
  animation: pop .6s cubic-bezier(.2, 1.4, .4, 1);
}
#end-text {
  font-family: "Caveat", cursive;
  font-size: 1.7rem;
  line-height: 1.35;
  white-space: pre-line;
}
#end-stats { margin-top: 14px; font-size: .95rem; color: var(--bordeaux); }
@keyframes pop { from { transform: scale(.7); opacity: 0; } }

.heart {
  position: fixed;
  bottom: -40px;
  font-size: 26px;
  pointer-events: none;
  animation: rise linear forwards;
  z-index: 11;
}
@keyframes rise { to { transform: translateY(-115vh) rotate(25deg); opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  .inner { transition: none; }
  #end .letter { animation: none; }
  .heart { display: none; }
}
</style>
</head>
<body>

<h1 id="title"></h1>

<!-- Écran d'intro -->
<section id="intro">
  <p id="intro-text"></p>
  <p id="intro-sign"></p>
  <div class="center"><button id="start">Commencer le jeu</button></div>
</section>

<!-- Écran de jeu -->
<section id="game" class="hidden" style="width:100%; display:flex; flex-direction:column; align-items:center;">
  <p id="stats">Coups : 0 &nbsp;&nbsp; Paires : 0 / 12</p>
  <div id="board"></div>
</section>

<!-- Écran de fin -->
<div id="end" class="hidden">
  <div class="letter">
    <p id="end-text"></p>
    <p id="end-stats"></p>
    <button id="replay">Rejouer</button>
  </div>
</div>

<script>
const HEART_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-10-9.3C.3 8.4 2.2 4 6.2 4c2.3 0 3.7 1.3 4.6 2.6h2.4C14.1 5.3 15.5 4 17.8 4c4 0 5.9 4.4 4.2 7.7C19.5 16.4 12 21 12 21z"/></svg>';

const $ = (id) => document.getElementById(id);
$("title").textContent = CONFIG.titre;
$("intro-text").textContent = CONFIG.intro;
$("intro-sign").textContent = CONFIG.signature;
$("end-text").textContent = CONFIG.messageFin;

let first = null, second = null, lock = false, moves = 0, pairs = 0;

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function updateStats() {
  $("stats").innerHTML = `Coups : ${moves} &nbsp;&nbsp; Paires : ${pairs} / ${CONFIG.images.length}`;
}

function buildBoard() {
  const board = $("board");
  board.innerHTML = "";
  first = second = null; lock = false; moves = 0; pairs = 0;
  updateStats();

  const deck = shuffle(CONFIG.images.flatMap((src, i) => [{ src, id: i }, { src, id: i }]));
  deck.forEach((c) => {
    const card = document.createElement("button");
    card.className = "card";
    card.dataset.id = c.id;
    card.setAttribute("aria-label", "Carte cachée");
    card.innerHTML = `
      <div class="inner">
        <div class="face back">${HEART_SVG}</div>
        <div class="face front"><img src="${c.src}" alt="Souvenir ${c.id + 1}" loading="lazy"></div>
      </div>`;
    card.addEventListener("click", () => flip(card));
    board.appendChild(card);
  });
}

function flip(card) {
  if (lock || card === first || card.classList.contains("matched")) return;
  card.classList.add("flipped");
  card.setAttribute("aria-label", "Carte retournée");

  if (!first) { first = card; return; }
  second = card;
  moves++;
  lock = true;

  if (first.dataset.id === second.dataset.id) {
    first.classList.add("matched");
    second.classList.add("matched");
    pairs++;
    updateStats();
    first = second = null; lock = false;
    if (pairs === CONFIG.images.length) setTimeout(win, 700);
  } else {
    updateStats();
    setTimeout(() => {
      first.classList.remove("flipped");
      second.classList.remove("flipped");
      first.setAttribute("aria-label", "Carte cachée");
      second.setAttribute("aria-label", "Carte cachée");
      first = second = null; lock = false;
    }, 950);
  }
}

function win() {
  $("end-stats").textContent = `Terminé en ${moves} coups`;
  $("end").classList.remove("hidden");
  for (let i = 0; i < 35; i++) {
    const h = document.createElement("span");
    h.className = "heart";
    h.textContent = ["❤", "💕", "💗"][i % 3];
    h.style.left = Math.random() * 100 + "vw";
    h.style.animationDuration = 4 + Math.random() * 4 + "s";
    h.style.animationDelay = Math.random() * 3 + "s";
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 12000);
  }
}

$("start").addEventListener("click", () => {
  $("intro").classList.add("hidden");
  $("game").classList.remove("hidden");
  buildBoard();
});

$("replay").addEventListener("click", () => {
  $("end").classList.add("hidden");
  buildBoard();
});
</script>
</body>
</html>
